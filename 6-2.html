<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .title{
            display: flex;
            width: 500px;
            height:33px;
            line-height: 33px;
            margin: 50px;
        }
        .title h2{
            font-size: 14px;
            color: #039;
            padding-left: 10px;
        }
        .title a{
            font-size: 12px;
            color:#ccc;
            text-decoration: none;
            padding-right: 16px;
        }
        .title:first-child{
            display: flex;
            justify-content: space-between;
            border: 1px solid rgb(236, 158, 214);
        }
        .title:nth-child(2){
            display: flex;
            border: 1px solid rgb(236, 158, 214);
        }
        .title:nth-child(2)h2{
            flex-grow:1;
        

        }
        .title:nth-child(3){
            position: relative;
            border-bottom: 1px solid rgb(236, 158, 214);
        }
        .title:nth-child(3)a{
            position: absolute;
            right: 10px;
            top:0;
        }


    </style>
</head>
<body>
    <div class="title">
        <h2>徐玥桐的标题</h2>
        <a href="#">更多</a>
    </div>
    <div class="title">

    </div>

    </div>

    </div>
</body>
</html>
