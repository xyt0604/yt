<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation 背景颜色变化</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #f3f4f6;
            font-family: sans-serif;
        }

        .box {
            width: 220px;
            height: 220px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            animation: change-color 4s infinite;
        }

        @keyframes change-color {
            0% {
                background-color: #e74c3c;
                border-radius: 12px;
            }
            25% {
                background-color: #f1c40f;
                border-radius: 50%;
            }
            50% {
                background-color: #2ecc71;
                border-radius: 30% 70% 30% 70% / 30% 30% 70% 70%;
            }
            75% {
                background-color: #3498db;
                border-radius: 70% 30% 70% 30% / 70% 70% 30% 30%;
            }
            100% {
                background-color: #9b59b6;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box">522xyt</div>
</body>
</html>
