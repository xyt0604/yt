<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>522 xyt</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <form action="http://huanqiu.com" name="yl">
        <p>
            用户名：<input type="text" name="username">
        </p>
            密码：<input type="password" name="password">
        </p>
        <p>
            性别：<input type="radio" name="gender" value="m">男
            <input type="radio" name="gender" value="f">女
            <input type="radio" name="gender" value="secret"> 保密
        </p>
        <p>
            爱好：<input type="checkbox" name="hobby" value="basketball">篮球
            <input type="checkbox" name="hobby" value="football">足球
            <input type="checkbox" name="hobby" value="swimming">游泳
        </p>
       <p>
            籍贯：<select name="province">
                <option value="beijing">北京</option>
                <option value="shanghai" selected>上海</option>
                <option value="guangdong">广东</option>
                <option value="zhejiang">浙江</option>
                </select>
        </p>
        <p>
            个人简介：<textarea name="introduction" cols="30" rows="5"></textarea>  
        </p>

        <p>
            出生日期：<input type="date" name="birthday">
        </p>
        <p>
            多文件上传：<input type="file" name="file" multiple>
        </p>

        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交">
            <input type="reset" value="重置">
        </p>


    </form>
        <button>表单外的按钮</button>

    </form>

</body>
</html>
