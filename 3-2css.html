<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>522 xyt</title>
    <style>
        p{
            color: rgb(242, 113, 191);
            font-size: 50px;
        }
        /*标签选择题*/
        #box{
            width: 600px;
            height: 500px;
            background-color: rgb(195, 184, 190);
        }
        #box2{
            width: 600px;
            height: 200px;
            background-color: rgb(180, 210, 235);
            margin-top: 20px;
        }
        h2 {
            background-color: black;
            color: white;
            padding: 10px 20px;
            display: inline-block;
        }
    /*id选择器*/
        .n1{
            color: rgb(201, 42, 166);
            font-size: 50px;
        }
        .n2{
            color: rgb(30, 30, 190);
            font-size: 50px;
        }
        .n3{
            color: rgb(188, 232, 125);
            font-size: 50px;
        }
        .white-text{
            color: white;
        }
    
    </style>
</head>
<body>
    <h2>层叠样式表CSS </h2>
    <div id="box"> 
        <p>css<span class="white-text">选择器</span></p>
        <p><span class="n1">徐</span><span class="n2">玥</span><span class="n3">桐</span></p>

        <p>css属性  </p>

    </div>
    <div id="box2"></div>

</body>
</html>
