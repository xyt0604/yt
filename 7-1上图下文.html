<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        ul{
            list-style: none;
        }
    img{
        display: block;
    }
    .illist{
        display: flex;
        margin:8px;
    }
    .illist li{
        width: 30%;
        margin-right: 1px;
        flex-grow: 1;
        position: relative;
    }
    .illist img{
        width: 100%;
    }
    .illist p{
        text-align: center;
        font-size: 14px;
        line-height: 30px;
        /*绝对定位*/
        position: absolute;
        bottom: 0;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        color: #fff;
        left: 0;
        right: 0;
        font-weight: bold;
    }
    </style>

</head>
<body>
    <ul class="illist">
        <li>
            <img src="./img/b113a177ffd34be1b9c437344286a782.jpg" alt="">
            <p>徐玥桐的上图下文 </p>
        </li>
        <li>
            <img src="./img/4f4938338af243a7ab6e04137470aba4.jpg" alt="">
            <p>图片2</p>
        </li>
        <li>
            <img src="./img/bfd8b9a880b358a6fc21d343cd73abc8.jpg" alt="">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
